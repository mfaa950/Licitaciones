name: Búsqueda diaria de licitaciones

on:
  workflow_dispatch:

  schedule:
    # 15:00 UTC equivale a 12:00 en Uruguay
    - cron: "0 15 * * *"

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev

      - name: Ejecutar búsqueda e informe
        shell: Rscript {0}
        run: |
          source("AnalisisLicitaciones_Diario.R", echo = TRUE)

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: informe-licitaciones-${{ github.run_number }}
          path: |
            Licitaciones_ARCE_*.xlsx
            Licitaciones_relevantes_*.xlsx
            Informe_licitaciones_*.docx
          if-no-files-found: error
          retention-days: 30
      
