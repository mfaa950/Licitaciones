name: Busqueda diaria de licitaciones

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "AnalisisLicitaciones_Diario_corregido.R"
      - "generar_html.R"
      - ".github/workflows/ejecutar_licitaciones.yml"
  schedule:
    - cron: "0 12 * * *"

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libuv1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff-dev \
            libjpeg-dev \
            libwebp-dev \
            libcairo2-dev \
            pkg-config

      - name: Instalar paquetes de R
        shell: Rscript {0}
        run: |
          install.packages(
            c(
              "httr2",
              "rvest",
              "dplyr",
              "stringr",
              "purrr",
              "openxlsx",
              "lubridate",
              "officer",
              "flextable"
            ),
            repos = "https://cloud.r-project.org"
          )

      - name: Ejecutar búsqueda y generar HTML
        shell: Rscript {0}
        run: |
          source("generar_html.R", echo = TRUE)

      - name: Guardar resultados
        uses: actions/upload-artifact@v4
        with:
          name: informe-licitaciones-${{ github.run_number }}
          path: |
            Licitaciones_ARCE_*.xlsx
            Licitaciones_relevantes_*.xlsx
            Informe_licitaciones_*.docx
            docs/index.html
          if-no-files-found: error
          retention-days: 30

      - name: Publicar HTML en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No hay cambios en el HTML"
          else
            git commit -m "Actualizar informe diario de licitaciones [skip ci]"
            git push
          fi
