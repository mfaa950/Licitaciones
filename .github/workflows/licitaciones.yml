name: Informe diario de licitaciones

on:
  workflow_dispatch:
  schedule:
    - cron: "0 15 * * *" # 12:00 de Uruguay
  push:
    branches: [main]
    paths:
      - "AnalisisLicitaciones_Diario_corregido.R"
      - "generar_html.R"
      - ".github/workflows/licitaciones.yml"

permissions:
  contents: write

jobs:
  generar-informe:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Instalar paquetes de R
        shell: Rscript {0}
        run: |
          paquetes <- c("httr2", "rvest", "dplyr", "stringr", "purrr", "openxlsx", "lubridate", "officer", "flextable")
          faltantes <- paquetes[!vapply(paquetes, requireNamespace, logical(1), quietly = TRUE)]
          if (length(faltantes)) install.packages(faltantes, repos = "https://cloud.r-project.org")

      - name: Ejecutar consulta y generar HTML
        run: Rscript generar_html.R

      - name: Guardar resultados como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: informe-licitaciones
          path: |
            docs/index.html
            *.xlsx
            *.docx
          if-no-files-found: error
          retention-days: 30

      - name: Publicar HTML en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "El HTML no tuvo cambios."
          else
            git commit -m "Actualizar informe diario de licitaciones"
            git push
          fi
